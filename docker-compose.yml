# Production on your VPS:  docker compose up -d --build
# Reads secrets from .env next to this file. Put Nginx (deploy/nginx.conf) in front.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: facet:latest
    env_file: .env
    environment:
      FACET_ALLOW_EXTENDED_FILLS: "false"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/market/quotes?symbols=SPY"]
      interval: 60s
      timeout: 10s
      retries: 3

  worker:
    image: facet:latest
    depends_on: [web]
    env_file: .env
    environment:
      FACET_ALLOW_EXTENDED_FILLS: "false"
    command: ["npm", "run", "worker"]
    restart: unless-stopped
